(function(){
 const g=document.getElementById('gal'),lb=document.getElementById('lb'),li=lb.querySelector('img'),lc=lb.querySelector('figcaption');
 [...new Set(WORKS.map(w=>w.sec))].forEach(sec=>{
  const s=document.createElement('section');s.className='gsec';
  s.innerHTML='<h2></h2><div class="ggrid"></div>';s.querySelector('h2').textContent=sec;
  const grid=s.querySelector('.ggrid');
  WORKS.filter(w=>w.sec===sec).forEach(w=>{
   const b=document.createElement('button');b.type='button';b.className='gitem';
   b.innerHTML='<div class="th"><img decoding="async"></div><h3></h3><p></p>';
   const im=b.querySelector('img');im.src=w.img+'-720.webp';im.alt=w.title;im.loading='lazy';
   b.querySelector('h3').textContent=w.title;b.querySelector('p').textContent=w.caption;
   b.onclick=()=>{li.src=w.img+'-1200.webp';li.alt=w.title;lc.textContent=w.title+' — '+w.caption;previousFocus=b;document.body.style.overflow='hidden';lb.classList.add('on');lb.querySelector('button').focus()};
   grid.appendChild(b)});
  g.appendChild(s)});
 let previousFocus;
 lb.addEventListener('keydown',e=>{if(e.key==='Tab'){e.preventDefault();lb.querySelector('button').focus()}});
 const close=()=>{lb.classList.remove('on');document.body.style.overflow='';if(previousFocus)previousFocus.focus()};
 lb.onclick=e=>{if(e.target===lb||e.target.tagName==='BUTTON')close()};
 document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
})();
